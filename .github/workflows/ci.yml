name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/atividade.txt"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Java 21 · ${{ matrix.banco }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        banco: [postgresql, mysql, sqlserver, oracle]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_VENDOR: ${{ matrix.banco }}
      DB_HOST: 127.0.0.1
      DB_NAME: prelo
      DB_USER: prelo
      DB_PASSWORD: Prelo_Teste_2026
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Subir o banco (${{ matrix.banco }})
        run: |
          case "$DB_VENDOR" in
            postgresql)
              docker run -d --name db -p 5432:5432 -e POSTGRES_DB=prelo -e POSTGRES_USER=prelo \
                -e POSTGRES_PASSWORD="$DB_PASSWORD" postgres:16-alpine
              for i in $(seq 1 60); do docker exec db pg_isready -U prelo -d prelo && break; sleep 2; done ;;
            mysql)
              docker run -d --name db -p 3306:3306 -e MYSQL_DATABASE=prelo -e MYSQL_USER=prelo \
                -e MYSQL_PASSWORD="$DB_PASSWORD" -e MYSQL_RANDOM_ROOT_PASSWORD=yes mysql:8.4 \
                --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
              for i in $(seq 1 90); do docker exec db mysql -uprelo -p"$DB_PASSWORD" -e "SELECT 1" prelo >/dev/null 2>&1 && break; sleep 2; done ;;
            sqlserver)
              docker run -d --name db -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
                -e MSSQL_SA_PASSWORD="$DB_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
              for i in $(seq 1 90); do docker exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD" -Q "SELECT 1" -b >/dev/null 2>&1 && break; sleep 2; done
              docker exec db /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$DB_PASSWORD" -Q "
                CREATE DATABASE prelo;
                CREATE LOGIN prelo WITH PASSWORD = '$DB_PASSWORD', CHECK_POLICY = OFF;
                EXEC('USE prelo; CREATE USER prelo FOR LOGIN prelo; ALTER ROLE db_owner ADD MEMBER prelo;')" ;;
            oracle)
              docker run -d --name db -p 1521:1521 -e ORACLE_PASSWORD="$DB_PASSWORD" -e APP_USER=prelo \
                -e APP_USER_PASSWORD="$DB_PASSWORD" gvenzl/oracle-free:23-slim-faststart
              for i in $(seq 1 150); do [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && break; sleep 2; done ;;
          esac
          docker ps

      - name: Testes de integração (API, segurança, checkout, pagamentos, envio)
        run: mvn -B verify

      - name: Log do banco em caso de falha
        if: failure()
        run: docker logs db | tail -n 80

  web:
    name: Interface · React
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker · imagens e compose
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Compose válido nos quatro bancos
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=Prelo_Teste_2026|; s|^JWT_SECRET=.*|JWT_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-0001|" .env
          for banco in postgresql mysql sqlserver oracle; do
            COMPOSE_PROFILES=$banco DB_VENDOR=$banco docker compose config --quiet
          done
      - name: Construir as imagens
        run: docker compose build api web
