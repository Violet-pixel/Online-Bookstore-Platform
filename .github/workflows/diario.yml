name: Atividade diária

# 5 registros por dia, em horário de Brasília (UTC-3), cada um com um horário reserva
# caso o GitHub atrase ou pule o agendamento principal.
#   1º turno 08:41 (reserva 09:29)
#   2º turno 12:07 (reserva 12:54)
#   3º turno 15:33 (reserva 16:19)
#   4º turno 18:58 (reserva 19:47)
#   5º turno 22:26 (reserva 23:12)
on:
  schedule:
    - cron: "41 11 * * *"
    - cron: "29 12 * * *"
    - cron: "7 15 * * *"
    - cron: "54 15 * * *"
    - cron: "33 18 * * *"
    - cron: "19 19 * * *"
    - cron: "58 21 * * *"
    - cron: "47 22 * * *"
    - cron: "26 1 * * *"
    - cron: "12 2 * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: Turno a registrar
        type: choice
        options:
          - 1º turno
          - 2º turno
          - 3º turno
          - 4º turno
          - 5º turno
        default: 1º turno

permissions:
  contents: write

concurrency:
  group: atividade-diaria
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Registrar atividade
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          AGENDA: ${{ github.event.schedule }}
          TURNO_MANUAL: ${{ inputs.turno }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "Defina os secrets GIT_NAME e GIT_EMAIL no repositório."
            exit 1
          fi
          case "$AGENDA" in
            "41 11 * * *"|"29 12 * * *") TURNO="1º turno" ;;
            "7 15 * * *"|"54 15 * * *") TURNO="2º turno" ;;
            "33 18 * * *"|"19 19 * * *") TURNO="3º turno" ;;
            "58 21 * * *"|"47 22 * * *") TURNO="4º turno" ;;
            "26 1 * * *"|"12 2 * * *") TURNO="5º turno" ;;
            *) TURNO="${TURNO_MANUAL:-1º turno}" ;;
          esac
          export TZ=America/Sao_Paulo
          HOJE=$(date +%Y-%m-%d)
          ARQUIVO=.github/atividade.txt
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git pull --rebase --quiet origin main
          if grep -q "^$HOJE $TURNO " "$ARQUIVO" 2>/dev/null; then
            echo "A atividade de hoje ($TURNO) já foi registrada."
            exit 0
          fi
          echo "$HOJE $TURNO $(date +%H:%M) (Brasília)" >> "$ARQUIVO"
          tail -n 150 "$ARQUIVO" > "$ARQUIVO.tmp" && mv "$ARQUIVO.tmp" "$ARQUIVO"
          git add "$ARQUIVO"
          git commit -m "Atividade de $(date +%d/%m/%Y) ($TURNO)"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((tentativa * 15))
            git pull --rebase origin main
          done
          echo "Não foi possível enviar o commit depois de 3 tentativas."
          exit 1
